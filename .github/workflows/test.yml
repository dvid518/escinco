name: Tests

# Ejecuta la suite en cada push a main y en cada PR (DEUDA-024).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # ubuntu-latest migró a Ubuntu 26 (19/10/2026): pinamos a ubuntu-24.04,
    # igual que ci.yml, para evitar sorpresas del runner (Node por defecto,
    # Java para los emuladores, etc.). Node 22 no está deprecado.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # La suite estática es Node puro: package.json no declara dependencias.
      - name: Tests estáticos
        run: npm test

      # Los emuladores de Firestore/Auth arrancan sobre Java (JRE). firebase-tools
      # exige Java 21 o superior (MIN_SUPPORTED_JAVA_MAJOR_VERSION = 21): con
      # Java 17 el emulador no arranca y el paso falla.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Reglas contra emuladores
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,auth -- "node tests/run.mjs rules"
