name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # DEUDA: el lint todavía arrastra errores reales (no-console,
      # no-unused-vars, require-await...). Se ejecuta y se ve en el log, pero
      # no bloquea el CI mientras se limpia; quitar continue-on-error al llegar
      # a 0. Las librerías de js/lib/ están excluidas en eslint.config.js.
      - name: Run lint
        continue-on-error: true
        run: npm run lint
