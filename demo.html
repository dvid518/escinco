    <!-- PLANTILLAS DE MODAL · INICIO
         Cuerpos de modal declarados en HTML. Se clonan con
         contenidoDesdeTemplate() (js/ui/modal.js), que rellena los huecos
         [data-tpl] con textContent: sin XSS y sin peticiones extra.
         El service worker ya precachea este archivo. El bloque entero se
         replica en demo.html (la demo carga las mismas páginas);
         tests/plantillas.test.mjs verifica que no se desincronicen. -->

    <template id="tpl-confirmar-eliminar">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Eliminar este movimiento?</p>
            <p class="modal-message-desc">
                <strong data-tpl="concepto"></strong> ·
                <span data-tpl="fecha"></span>
            </p>
        </div>
    </template>

    <!-- Genéricos reutilizables por varios modales -->

    <template id="tpl-mensaje">
        <div class="modal-message">
            <p class="modal-message-desc" data-tpl="mensaje"></p>
        </div>
    </template>

    <template id="tpl-error">
        <div class="modal-message">
            <p class="modal-message-error" data-tpl="error"></p>
        </div>
    </template>

    <template id="tpl-cargando">
        <div class="modal-loading">
            <span data-tpl="logo"></span>
            <p class="modal-loading-text" data-tpl="texto"></p>
        </div>
    </template>

    <template id="tpl-resultado-simple">
        <div class="modal-message">
            <p class="modal-message-desc" data-tpl="descripcion"></p>
            <div class="modal-resultado">
                <div class="preview-item">
                    <span data-tpl="etiqueta-total"></span>
                    <span class="preview-number" data-tpl="total"></span>
                </div>
            </div>
        </div>
    </template>

    <!-- Configuración: cuenta, datos y reautenticación -->

    <template id="tpl-form-password">
        <form class="form-movimiento" data-tpl="form" data-tpl-attr="id">
            <div class="form-group">
                <label for="nueva-password">Nueva contraseña</label>
                <input type="password" id="nueva-password" class="form-input" autocomplete="new-password" required>
                <span class="form-hint">Mínimo 6 caracteres</span>
            </div>
            <div class="form-group">
                <label for="confirmar-password" data-tpl="etiqueta-confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" class="form-input" autocomplete="new-password" required>
            </div>
            <div id="password-error" class="modal-message-error" hidden></div>
        </form>
    </template>

    <template id="tpl-confirmar-logout">
        <div class="modal-message">
            <p class="modal-message-desc">
                ¿Estás seguro de que quieres cerrar sesión?
            </p>
        </div>
    </template>

    <template id="tpl-restaurar-cuentas">
        <div class="modal-message">
            <p class="modal-message-desc">
                Elige las cuentas archivadas que quieres volver a activas.
            </p>
            <p class="modal-message-hint">
                Recuperan su sitio en el sidebar y vuelven a sumar en el patrimonio
                y el dashboard. Sus movimientos no se han tocado.
            </p>
        </div>
        <div class="dashboard-editor-grid" data-tpl="opciones"></div>
    </template>

    <template id="tpl-cuenta-archivable">
        <label class="dashboard-card-opcion">
            <input type="checkbox" data-tpl="id" data-tpl-attr="value" checked>
            <span>
                <span data-tpl="nombre">Cuenta</span>
                <small data-tpl="saldo"></small>
            </span>
        </label>
    </template>

    <template id="tpl-archivo-invalido">
        <div class="modal-message">
            <p class="modal-message-error" data-tpl="error"></p>
            <p class="modal-message-desc">
                Asegúrate de que sea un archivo .dvid generado por escinco.
            </p>
        </div>
    </template>

    <template id="tpl-preview-importacion">
        <div class="modal-preview">
            <div class="preview-row">
                <span class="preview-label">Formato</span>
                <span class="preview-value" data-tpl="formato"></span>
            </div>
            <div class="preview-row">
                <span class="preview-label">Versión mínima</span>
                <span class="preview-value" data-tpl="version-minima"></span>
            </div>
            <div class="preview-row">
                <span class="preview-label">Exportado</span>
                <span class="preview-value" data-tpl="exportado"></span>
            </div>

            <div class="preview-content">
                <div class="preview-content-title">CONTENIDO</div>
                <div class="preview-item">
                    <span>Cuentas</span>
                    <span class="preview-number" data-tpl="cuentas"></span>
                </div>
                <div class="preview-item">
                    <span>Movimientos</span>
                    <span class="preview-number" data-tpl="movimientos"></span>
                </div>
                <div class="preview-item">
                    <span>Activos</span>
                    <span class="preview-number" data-tpl="activos"></span>
                </div>
                <div class="preview-item">
                    <span>Pendientes</span>
                    <span class="preview-number" data-tpl="pendientes"></span>
                </div>
                <div class="preview-item">
                    <span>Inversiones</span>
                    <span class="preview-number" data-tpl="posiciones"></span>
                </div>
                <div class="preview-item">
                    <span>Historial precios</span>
                    <span class="preview-number" data-tpl="historial"></span>
                </div>
                <div class="preview-item">
                    <span>Snapshots</span>
                    <span class="preview-number" data-tpl="snapshots"></span>
                </div>
            </div>

            <div class="modal-warning">
                Los datos se <strong>agregarán</strong> a los existentes. No se eliminará nada.
            </div>
        </div>
    </template>

    <template id="tpl-resultado-importacion">
        <div class="modal-message">
            <div class="modal-resultado">
                <div class="preview-item">
                    <span>Cuentas</span>
                    <span class="preview-number" data-tpl="cuentas"></span>
                </div>
                <div class="preview-item">
                    <span>Movimientos</span>
                    <span class="preview-number" data-tpl="movimientos"></span>
                </div>
                <div class="preview-item">
                    <span>Activos</span>
                    <span class="preview-number" data-tpl="activos"></span>
                </div>
                <div class="preview-item">
                    <span>Pendientes</span>
                    <span class="preview-number" data-tpl="pendientes"></span>
                </div>
                <div class="preview-item">
                    <span>Inversiones</span>
                    <span class="preview-number" data-tpl="posiciones"></span>
                </div>
                <div class="preview-item">
                    <span>Historial precios</span>
                    <span class="preview-number" data-tpl="historial"></span>
                </div>
                <div class="preview-item">
                    <span>Snapshots</span>
                    <span class="preview-number" data-tpl="snapshots"></span>
                </div>
            </div>
            <p class="modal-message-warning" data-tpl="errores" data-tpl-oculto hidden></p>
        </div>
    </template>

    <template id="tpl-eliminar-todos">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Estás seguro?</p>
            <p class="modal-message-desc">Se eliminarán <strong>todos</strong> tus datos de escinco:</p>
            <div class="modal-list">
                • Cuentas<br>
                • Movimientos<br>
                • Inversiones<br>
                • Pendientes<br>
                • Snapshots<br>
                • Trades
            </div>
        </div>
    </template>

    <template id="tpl-eliminar-cuenta">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Estás seguro?</p>
            <p class="modal-message-desc">
                Se eliminará tu <strong>cuenta</strong> y <strong>todos tus datos</strong> de escinco permanentemente:
            </p>
            <div class="modal-list">
                • Cuentas<br>
                • Movimientos<br>
                • Inversiones<br>
                • Pendientes<br>
                • Snapshots<br>
                • Trades
            </div>
            <p class="modal-message-desc">
                Antes de borrar se descargará automáticamente un respaldo <strong>.dvid</strong>.
            </p>
            <p class="modal-message-error">Esta acción no se puede deshacer.</p>
        </div>
    </template>

    <template id="tpl-confirmar-escritura">
        <div class="modal-message">
            <p class="modal-message-title-danger">Última oportunidad</p>
            <p class="modal-message-desc">
                Para confirmar, escribe <strong class="text-danger">ELIMINAR</strong> a continuación:
            </p>
            <input type="text" data-tpl="campo" data-tpl-attr="id"
                   class="form-input modal-input-confirm"
                   placeholder="Escribe ELIMINAR"
                   autocomplete="off">
        </div>
    </template>

    <template id="tpl-reauth-password">
        <div class="modal-message">
            <p class="modal-message-desc">
                Por seguridad, confirma tu contraseña antes de continuar:
            </p>
            <input type="password" id="reauth-password"
                   class="form-input modal-input-confirm"
                   placeholder="Tu contraseña"
                   autocomplete="current-password">
            <p class="modal-message-error" id="reauth-error" hidden></p>
        </div>
    </template>

    <template id="tpl-reauth-google">
        <div class="modal-message">
            <p class="modal-message-desc">
                Por seguridad, vuelve a iniciar sesión con Google para continuar.
            </p>
        </div>
    </template>

    <!-- Confirmaciones con un dato en negrita -->

    <template id="tpl-confirmar-meta">
        <div class="modal-message">
            <p class="modal-message-desc">
                ¿Eliminar la meta <strong data-tpl="nombre"></strong>?
            </p>
        </div>
    </template>

    <template id="tpl-confirmar-pendiente">
        <div class="modal-message">
            <p class="modal-message-desc">
                ¿Eliminar el pendiente "<strong data-tpl="concepto"></strong>"?
            </p>
        </div>
    </template>

    <!-- Respaldo y crédito -->

    <template id="tpl-respaldo-exportado">
        <div class="modal-message">
            <p class="modal-message-title" data-tpl="archivo"></p>
            <p class="modal-message-desc">
                El archivo se ha descargado correctamente.<br>
                Guárdalo en un lugar seguro.
            </p>
        </div>
    </template>

    <template id="tpl-credito-educativo">
        <div class="credito-educativo">
            <!-- La clase de nivel (normal/aviso/critico) y el ancho de la barra los
                 añade el JS sobre el fragmento: un elemento no puede llevar dos
                 data-tpl y aquí hacen falta clase y estilo a la vez. -->
            <div class="credito-educativo-cifra">
                <span class="label">Uso de la línea de crédito</span>
                <span class="valor" data-tpl="porcentaje"></span>
            </div>
            <div class="aporte-progreso-wrap">
                <div class="aporte-progreso">
                    <div class="aporte-progreso-barra"></div>
                </div>
                <span class="badge" data-tpl="badge"></span>
            </div>
            <p class="credito-educativo-detalle" data-tpl="detalle"></p>
            <div class="credito-educativo-niveles">
                <div class="credito-educativo-fila">
                    <span class="punto normal"></span>
                    <span>Menos del <strong data-tpl="aviso"></strong> de la línea: uso saludable.</span>
                </div>
                <div class="credito-educativo-fila">
                    <span class="punto aviso"></span>
                    <span>Entre <strong data-tpl="aviso"></strong> y <strong data-tpl="critico"></strong>: uso elevado; las entidades pueden verlo como riesgo en tu historial crediticio.</span>
                </div>
                <div class="credito-educativo-fila">
                    <span class="punto critico"></span>
                    <span>Más del <strong data-tpl="critico"></strong>: uso excesivo o peligroso; conviene reducir la deuda cuanto antes.</span>
                </div>
            </div>
            <p class="credito-educativo-tip">Tip: paga más que el mínimo, respeta tu día de pago y limita los consumos con la tarjeta para mantener una utilización sana.</p>
        </div>
    </template>

    <!-- Aviso de la versión inversionista -->

    <template id="tpl-info-inversionista">
        <div class="info-inversionista">
            <p>Escinco tiene una versión inversionista con dos páginas extra para seguir tu cartera además de tus cuentas:</p>
            <ul class="info-inversionista-lista">
                <li class="info-inversionista-item">
                    <span class="info-inversionista-icono" data-tpl="icono-inversiones"></span>
                    <span class="info-inversionista-texto">
                        <strong>Inversiones</strong>
                        <span>Portafolio, posiciones, precios y P&L de tus activos, con su evolución en el tiempo.</span>
                    </span>
                </li>
                <li class="info-inversionista-item">
                    <span class="info-inversionista-icono" data-tpl="icono-trading"></span>
                    <span class="info-inversionista-texto">
                        <strong>Trading</strong>
                        <span>Trades, órdenes y operaciones P2P, con su historial y su estado.</span>
                    </span>
                </li>
            </ul>
            <p>Puedes activarlas o desactivarlas cuando quieras desde Configuración.</p>
        </div>
    </template>

    <!-- Buscador global -->

    <template id="tpl-buscador-global">
        <div class="buscador-global">
            <div class="buscador-header">
                <span class="buscador-header-icono" data-tpl="icono"></span>
                <input type="text" id="buscador-input" class="buscador-input"
                       placeholder="Buscar en páginas, cuentas, movimientos y activos..."
                       aria-label="Buscar global" autocomplete="off">
            </div>
            <div class="buscador-resultados" role="listbox">
                <p class="lista-vacia">Escribe para buscar…</p>
            </div>
        </div>
    </template>

    <!-- Atajos de teclado -->

    <template id="tpl-atajos-modal">
        <div class="atajos-modal">
            <div class="atajos-grupos" data-tpl="grupos"></div>
        </div>
    </template>

    <template id="tpl-atajos-grupo">
        <div class="atajos-grupo">
            <h3 class="atajos-grupo-titulo" data-tpl="titulo"></h3>
            <div class="atajos-lista" data-tpl="filas"></div>
        </div>
    </template>

    <template id="tpl-atajo-fila">
        <div class="atajo">
            <span class="atajo-teclas" data-tpl="teclas"></span>
            <span class="atajo-descripcion" data-tpl="descripcion"></span>
        </div>
    </template>

    <!-- Movimientos: selector de tipo, dirección de trade y confirmaciones -->

    <template id="tpl-grupo-tipos-destacados">
        <div class="selector-tipos selector-tipos-destacados" data-tpl="botones"></div>
    </template>

    <template id="tpl-grupo-tipos-secundarios">
        <div class="selector-tipos selector-tipos-secundarios" data-tpl="botones"></div>
    </template>

    <!-- El destacado es un <button>, no un div que envuelve a otro button:
         con el div exterior la zona sensible era el cuadrado entero de la celda
         y quedaba fuera del recorrido del teclado (BUG-016). -->
    <template id="tpl-tipo-principal">
        <button class="tipo-movimiento-btn tipo-principal" type="button"
                data-tpl="tipo" data-tpl-attr="data-tipo,aria-label">
            <span class="tipo-icono" aria-hidden="true" data-tpl="icono"></span>
            <span class="tipo-texto" data-tpl="nombre"></span>
        </button>
    </template>

    <template id="tpl-tipo-secundario">
        <button class="tipo-movimiento-btn tipo-secundario" type="button"
                data-tpl="tipo" data-tpl-attr="data-tipo">
            <span data-tpl="nombre"></span>
        </button>
    </template>

    <!-- Si la cantidad de secundarios es impar, el último (error) ocupa ambas columnas. -->
    <template id="tpl-tipo-secundario-full">
        <button class="tipo-movimiento-btn tipo-secundario span-full" type="button"
                data-tpl="tipo" data-tpl-attr="data-tipo">
            <span data-tpl="nombre"></span>
        </button>
    </template>

    <template id="tpl-direccion-trade">
        <div class="selector-tipos selector-tipos-secundarios">
            <button class="tipo-movimiento-btn tipo-secundario" data-direccion="long" type="button">Largo (Long)</button>
            <button class="tipo-movimiento-btn tipo-secundario" data-direccion="short" type="button">Corto (Short)</button>
        </div>
    </template>

    <template id="tpl-confirmar-eliminar-varios">
        <div class="modal-message">
            <p class="modal-message-title-danger" data-tpl="pregunta"></p>
        </div>
    </template>

    <template id="tpl-detalle-movimiento">
        <div data-tpl="formulario"></div>
        <div class="movimiento-detalle-acciones" id="detalle-acciones"></div>
    </template>

    <!-- Cuentas -->

    <template id="tpl-confirmar-cuenta">

                <span class="value" data-tpl="corte"></span>
            </div>
            <div class="field">
                <span class="label">Próximo pago</span>
                <span class="value" data-tpl="pago"></span>
            </div>
            <div class="field">
                <span class="label">Desgravamen</span>
                <span class="value" data-tpl="desgravamen"></span>
            </div>
            <span data-tpl="anualidad" data-tpl-reemplazar></span>
            <span data-tpl="numero" data-tpl-reemplazar></span>
            <span data-tpl="vence" data-tpl-reemplazar></span>
            <div class="field">
                <span class="label">Patrimonio</span>
                <span class="value" data-tpl="patrimonio"></span>
            </div>
        </div>
    </template>

    <template id="tpl-cuenta-vista">
        <div class="cuenta-vista" data-tpl="raiz" data-tpl-attr="class">
            <div class="cuenta-vista-movimientos">
                <div class="cuenta-mov-head">
                    <div class="totales" id="totales-movimientos-cuenta"></div>
                </div>
                <div class="lista-cards" id="lista-movimientos-cuenta"></div>
            </div>
            <div class="cuenta-vista-info" data-tpl="info"></div>
        </div>
    </template>

    <template id="tpl-cuenta-modal-vistas">
        <div class="cuenta-modal-vista" data-vista="info" data-tpl="info"></div>
        <div class="cuenta-modal-vista" data-vista="movimientos" hidden>
            <div class="lista-cards" data-tpl="movimientos"></div>
        </div>
    </template>

    <template id="tpl-totales-linea-credito">
        <span class="totales-item">
            <span class="totales-negativo" data-tpl="negativo"></span>
        </span>
    </template>

    <template id="tpl-totales-linea-normal">
        <span class="totales-item">
            <span class="totales-positivo" data-tpl="positivo"></span>
            <span class="totales-sep">/</span>
            <span class="totales-negativo" data-tpl="negativo"></span>
        </span>
    </template>

    <template id="tpl-totales-acciones-credito">
        <div class="totales-acciones">
            <button type="button" class="totales-btn" id="btn-ver-modal-cuenta" title="Ver en modal" aria-label="Ver en modal" data-tpl="icono-modal"></button>
            <button type="button" class="totales-btn" id="btn-gasto-tarjeta" title="Registrar gasto" aria-label="Registrar gasto" data-tpl="icono-gasto"></button>
            <span data-tpl="pagar" data-tpl-reemplazar></span>
        </div>
    </template>

    <template id="tpl-totales-acciones-normal">
        <div class="totales-acciones">
            <button type="button" class="totales-btn" id="btn-ver-modal-cuenta" title="Ver en modal" aria-label="Ver en modal" data-tpl="icono-modal"></button>
            <button type="button" class="totales-btn" id="btn-nuevo-movimiento-cuenta" title="Nuevo movimiento" aria-label="Nuevo movimiento" data-tpl="icono-nuevo"></button>
        </div>
    </template>

    <template id="tpl-btn-pagar-tarjeta">
        <button type="button" class="totales-btn pagar-tarjeta-btn" id="btn-pagar-tarjeta" title="Pagar tarjeta" aria-label="Pagar tarjeta">Pagar tarjeta</button>
    </template>

    <template id="tpl-totales-cuenta">
        <span class="totales-count" data-tpl="count"></span>
        <span data-tpl="lineas"></span>
        <span data-tpl="acciones" data-tpl-reemplazar></span>
    </template>

    <template id="tpl-totales-movimientos">
        <span class="totales-count" data-tpl="count"></span>
        <span data-tpl="lineas"></span>
        <span data-tpl="ganancia"></span>
        <div class="totales-acciones">
            <button type="button" class="totales-btn" id="btn-nuevo-movimiento" title="Nuevo movimiento" aria-label="Nuevo movimiento" data-tpl="icono-nuevo"></button>
        </div>
    </template>

    <template id="tpl-totales-mov-linea">
        <span class="totales-item">
            <span class="totales-positivo" data-tpl="positivo"></span>
            <span class="totales-sep">/</span>
            <span class="totales-negativo" data-tpl="negativo"></span>
            <span class="totales-divisa" data-tpl="divisa"></span>
        </span>
    </template>

    <template id="tpl-totales-mov-ganancia">
        <span class="totales-item">
            <span class="totales-ganancia" data-tpl="ganancia"></span>
            <span class="totales-divisa" data-tpl="divisa"></span>
        </span>
    </template>

    <!-- ··· DASHBOARD ··· -->

    <template id="tpl-card-vacio">
        <p class="card-vacio"><span data-tpl="texto"></span></p>
    </template>

    <template id="tpl-card-dato">
        <div class="card-dato">
            <span class="card-dato-label" data-tpl="label"></span>
            <span class="card-dato-valor" data-tpl="valor"></span>
        </div>
    </template>

    <template id="tpl-card-comprimir">
        <button type="button" class="card-comprimir" data-card-comprimir aria-expanded="true" aria-label="Comprimir tarjeta" title="Comprimir tarjeta"><span data-tpl="icono"></span></button>
    </template>

    <template id="tpl-dashboard-card-uso">
        <div class="card-uso">
            <div class="card-uso-barra"><span data-tpl="barra" data-tpl-attr="id"></span></div>
            <span class="card-uso-pct" data-tpl="porcentaje" data-tpl-attr="id"></span>
        </div>
    </template>

    <template id="tpl-dashboard-card-cuenta">
        <div class="glass card card-navegable card-cuenta" data-tpl="card" data-tpl-attr="id,data-dashboard-card,class,aria-label" role="group" tabindex="0">
            <div class="card-header">
                <span class="card-title" data-tpl="titulo"></span>
                <div class="card-header-controles">
                    <span class="badge" data-tpl="estado" data-tpl-attr="id"><span class="skeleton skeleton-text skeleton-badge" aria-hidden="true"></span></span>
                    <span data-tpl="comprimir" data-tpl-reemplazar></span>
                </div>
            </div>
            <div class="card-value" data-tpl="valor" data-tpl-attr="id"><span class="skeleton skeleton-text skeleton-value" aria-hidden="true"></span></div>
            <div class="card-sub" data-tpl="detalle" data-tpl-attr="id"><span class="skeleton skeleton-text" aria-hidden="true"></span></div>
            <span data-tpl="uso" data-tpl-reemplazar></span>
            <div class="card-datos" data-tpl="datos" data-tpl-attr="id"></div>
        </div>
    </template>

    <template id="tpl-dashboard-card-activo">
        <div class="glass card card-navegable card-activo" data-tpl="card" data-tpl-attr="id,data-dashboard-card" role="group" tabindex="0">
            <div class="card-header">
                <span class="card-title" data-tpl="nombre" data-tpl-attr="id"></span>
                <div class="card-header-controles">
                    <span class="badge" data-tpl="estado" data-tpl-attr="id"></span>
                    <span data-tpl="comprimir" data-tpl-reemplazar></span>
                </div>
            </div>
            <div class="card-value" data-tpl="valor" data-tpl-attr="id"><span class="skeleton skeleton-text skeleton-value" aria-hidden="true"></span></div>
            <div class="card-sub" data-tpl="detalle" data-tpl-attr="id"><span class="skeleton skeleton-text" aria-hidden="true"></span></div>
            <div class="card-datos" data-tpl="datos" data-tpl-attr="id"></div>
        </div>
    </template>

    <template id="tpl-dashboard-card-edicion">
        <span class="dashboard-card-handle" data-dashboard-drag-handle role="button" tabindex="0" aria-label="Arrastrar card" data-tpl="handle"></span>
        <button type="button" class="dashboard-card-mover" data-dashboard-mover data-tpl="subir" data-tpl-attr="data-id" data-direccion="-1" aria-label="Mover card hacia arriba">↑</button>
        <button type="button" class="dashboard-card-mover" data-dashboard-mover data-tpl="bajar" data-tpl-attr="data-id" data-direccion="1" aria-label="Mover card hacia abajo">↓</button>
    </template>

    <template id="tpl-grafico-cargando">
        <div class="skeleton skeleton-chart" role="status" aria-label="Cargando gráfico" aria-busy="true"><span class="skeleton skeleton-grafico-bloque" aria-hidden="true"></span></div>
    </template>

    <template id="tpl-grafico-vacio">
        <div class="grafico-vacio">
            <p class="grafico-vacio-texto" data-tpl="texto"></p>
            <p class="grafico-vacio-hint" data-tpl="hint" data-tpl-oculto></p>
        </div>
    </template>

    <template id="tpl-dashboard-list-item">
        <div class="dashboard-list-item" data-tpl="item" data-tpl-attr="class">
            <div class="dashboard-list-info">
                <span class="dashboard-list-title" data-tpl="titulo"></span>
                <span class="dashboard-list-detail" data-tpl="detalle" data-tpl-attr="class"></span>
                <span data-tpl="extra" data-tpl-reemplazar></span>
            </div>
            <span class="dashboard-list-value" data-tpl="valor" data-tpl-attr="class"><span data-tpl="valor-texto"></span></span>
        </div>
    </template>

    <template id="tpl-dashboard-estrategia-cuenta">
        <button type="button" class="estrategia-cuenta" data-tpl="btn" data-tpl-attr="data-dashboard-cuenta-estrategia"><span data-tpl="icono"></span> <span data-tpl="nombre"></span></button>
    </template>

    <template id="tpl-distribucion-item">
        <div class="distribucion-item">
            <div class="distribucion-cabecera">
                <span data-tpl="etiqueta"></span>
                <strong data-tpl="porcentaje"></strong>
            </div>
            <div class="distribucion-barra">
                <span data-tpl="barra" data-tpl-attr="class,style"></span>
            </div>
            <span class="distribucion-valor" data-tpl="valor"></span>
        </div>
    </template>

    <template id="tpl-alerta-item">
        <div class="alerta-item" data-tpl="alerta" data-tpl-attr="class">
            <span data-tpl="icono"></span>
            <div>
                <span data-tpl="titulo"></span>
                <small data-tpl="detalle"></small>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard-movimiento">
        <div class="movimiento-item" data-tpl="item" data-tpl-attr="data-movimiento-id" role="button" tabindex="0" title="Ver movimiento">
            <div class="movimiento-info">
                <span class="movimiento-titulo"><span data-tpl="titulo"></span><span data-tpl="etiquetas"></span></span>
                <span class="movimiento-detalle" data-tpl="detalle"></span>
            </div>
            <span class="movimiento-monto" data-tpl="monto" data-tpl-attr="class"><span data-tpl="monto-texto"></span></span>
        </div>
    </template>

    <template id="tpl-dashboard-favorito">
        <div class="favorito-item" data-tpl="item" data-tpl-attr="data-activo-id" role="button" tabindex="0" title="Ver historial de precios">
            <div class="favorito-info">
                <span class="favorito-nombre" data-tpl="nombre"></span>
                <span class="favorito-simbolo" data-tpl="simbolo"></span>
            </div>
            <span class="favorito-precio" data-tpl="precio"></span>
        </div>
    </template>

    <template id="tpl-favorito-item">
        <div class="favorito-item" data-tpl="item" data-tpl-attr="data-favorito-id" role="button" tabindex="0" title="Ejecutar favorito">
            <div class="favorito-info">
                <span class="favorito-nombre" data-tpl="nombre"></span>
                <span class="favorito-tipo" data-tpl="tipo"></span>
                <div class="favorito-etiquetas" data-tpl="etiquetas"></div>
            </div>
            <div class="favorito-resumen">
                <span class="favorito-cuenta" data-tpl="cuenta"></span>
                <span class="favorito-monto" data-tpl="monto"></span>
            </div>
        </div>
    </template>

    <template id="tpl-dashboard-meta">
        <div data-tpl="item" data-tpl-attr="class,data-meta-id" role="button" tabindex="0" title="Aportar a la meta">
            <div class="meta-info">
                <span class="meta-nombre" data-tpl="nombre"></span>
                <span class="meta-cantidad" data-tpl="cantidad"></span>
            </div>
            <span class="meta-porcentaje" data-tpl="porcentaje"></span>
        </div>
    </template>

    <template id="tpl-dashboard-vencimiento">
        <div class="card-item vencimiento-item" data-tpl="item" data-tpl-attr="class,data-tipo,data-id" role="button" tabindex="0">
            <div class="card-item-info">
                <span class="card-item-titulo" data-tpl="titulo"></span>
                <span class="card-item-detalle" data-tpl="detalle"></span>
            </div>
            <span class="card-item-valor" data-tpl="valor" data-tpl-attr="class"><span data-tpl="valor-texto"></span></span>
        </div>
    </template>

    <template id="tpl-vencimientos-vacio">
        <div class="modal-message">
            <p class="modal-message-desc">Sin vencimientos en los próximos <span data-tpl="dias"></span> días.</p>
        </div>
    </template>

    <template id="tpl-modal-mensaje">
        <div class="modal-message"><p class="modal-message-desc" data-tpl="texto"></p></div>
    </template>

    <template id="tpl-lista-vacio-hint">
        <p class="lista-vacia">
            <span data-tpl="texto"></span>
            <br><br>
            <span class="lista-vacia-hint" data-tpl="hint"></span>
        </p>
    </template>

    <template id="tpl-cuentas-vacio">
        <h2>No hay cuentas</h2>
        <p class="lista-vacia">
            Crea tu primera cuenta usando el botón <strong>"Cuenta"</strong> en la barra inferior.
        </p>
    </template>

    <template id="tpl-cuentas-vacio-archivadas">
        <h2>No hay cuentas activas</h2>
        <p class="lista-vacia">
            Tienes <span data-tpl="cantidad"></span> cuenta<span data-tpl="plural"></span> archivada<span data-tpl="plural2"></span>.
            No se han borrado: siguen guardadas y conservan sus movimientos.
        </p>
        <p class="lista-vacia">
            Puedes restaurarlas desde <strong>Configuración › Datos</strong>.
        </p>
    </template>

    <template id="tpl-posicion-item">
        <div class="posicion-item" data-tpl="item" data-tpl-attr="class,data-posicion-id,data-activo-id">
            <button type="button" class="posicion-favorito" data-tpl="favorito" data-tpl-attr="class,data-activo-id,aria-label,title"><span data-tpl="icono-favorito"></span></button>
            <div class="posicion-info">
                <div class="posicion-nombre">
                    <span data-tpl="nombre"></span>
                    <span class="posicion-simbolo" data-tpl="simbolo"></span>
                    <span class="badge" data-tpl="fuente" data-tpl-attr="class"></span>
                </div>
                <div class="posicion-detalle" data-tpl="detalle"></div>
            </div>
            <div class="card-item-valor-wrap">
                <div class="posicion-valores">
                    <div class="posicion-valor" data-tpl="valor"></div>
                    <div class="posicion-rendimiento" data-tpl="rendimiento" data-tpl-attr="class"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="tpl-estrategia-item">
        <div class="estrategia-item" data-tpl="item" data-tpl-attr="class,data-id">
            <div class="estrategia-info">
                <div class="estrategia-nombre">
                    <span data-tpl="nombre"></span>
                    <span class="estrategia-simbolo" data-tpl="simbolo"></span>
                </div>
                <div class="estrategia-detalle" data-tpl="detalle"></div>
            </div>
            <div class="card-item-valor-wrap">
                <div class="posicion-valores">
                    <div class="posicion-valor" data-tpl="monto"></div>
                    <div class="posicion-rendimiento" data-tpl="estado"></div>
                </div>
                <div class="card-item-acciones">
                    <button type="button" class="card-action-btn estrategia-ejecutar" data-accion="ejecutar" data-tpl="ejecutar" data-tpl-attr="data-id" title="Ejecutar ahora" aria-label="Ejecutar ahora"><span data-tpl="icono-ejecutar"></span></button>
                    <button type="button" class="card-action-btn estrategia-editar" data-accion="editar" data-tpl="editar" data-tpl-attr="data-id" title="Editar" aria-label="Editar"><span data-tpl="icono-editar"></span></button>
                    <button type="button" class="card-action-btn estrategia-pausar" data-tpl="pausar" data-tpl-attr="data-accion,data-id,title,aria-label"><span data-tpl="icono-pausar"></span></button>
                    <button type="button" class="card-action-btn danger estrategia-eliminar" data-accion="eliminar" data-tpl="eliminar" data-tpl-attr="data-id" title="Eliminar" aria-label="Eliminar"><span data-tpl="icono-eliminar"></span></button>
                </div>
            </div>
        </div>
    </template>

    <!-- PLANTILLAS DE MODAL · FIN -->

    <script type="module" src="js/demo/demo.js"></script>
</body>

</html>
