<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
    <base href="/">
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>escinco | Demo interactiva</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="description"
        content="Prueba escinco con datos de ejemplo: dashboard, cuentas, movimientos, inversiones y trading. Todo se guarda en tu navegador.">
    <meta name="theme-color" content="#141414">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg" media="(prefers-color-scheme: light)">
    <link rel="canonical" href="https://escinco.web.app/demo/dashboard">

    <!-- Estilos del armazón (shell) + estilos propios de la demo. -->
    <link rel='stylesheet' type='text/css' media='screen' href='css/style.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/componentes.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/navegacion.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/configuracion.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/modal.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/pendientes.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/iconos.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/demo.css'>

    <!-- La demo no habla con Firebase: redirigimos el SDK a mocks locales.
         Debe ir antes de cualquier <script type="module">. -->
    <script type="importmap">
        {
            "imports": {
                "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js": "/firebase/demo/app.js",
                "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js": "/firebase/demo/auth.js",
                "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js": "/firebase/demo/firestore.js"
            }
        }
    </script>
</head>

<body class="loading">
    <div class="demo-aviso" role="note">
        <span><strong>escinco demo.</strong> Datos de prueba guardados solo en este navegador.</span>
        <span class="demo-aviso-acciones">
            <button type="button" class="demo-link" id="demo-reset">Reiniciar demo</button>
            <button type="button" class="demo-link" id="demo-salir">Salir</button>
        </span>
    </div>

    <!-- NAVBAR -->
    <header class="nav-section">
        <div class="logo-container glass tab">
            <a href="/demo/dashboard" data-page="dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="80px" height="80px" id="logo" viewBox="0 0 32 31">
                    <g id="text3035" fill="currentColor">
                        <path id="path3063" d="M 0,14.355469 2.2460938,7.421875 C 7.4218645,9.2448552 11.181626,10.82363 13.525391,12.158203 12.906885,6.2663426 12.581365,2.2136123 12.548828,0 l 7.080078,0 c -0.09768,3.2227258 -0.472027,7.2591801 -1.123047,12.109375 3.35284,-1.692646 7.193982,-3.2551444 11.523438,-4.6875 l 2.246094,6.933594 c -4.134146,1.367244 -8.186877,2.278702 -12.158204,2.734375 1.985652,1.725314 4.785129,4.801483 8.398438,9.228515 L 22.65625,30.46875 C 20.768205,27.89718 18.53839,24.397835 15.966797,19.970703 13.557926,24.560595 11.442043,28.059941 9.6191406,30.46875 L 3.8574219,26.318359 C 7.6334528,21.663463 10.335273,18.587294 11.962891,17.089844 7.763661,16.276098 3.7760348,15.364641 0,14.355469"/>
                    </g>
                </svg>
            </a>
        </div>
        <div class="nav-container">
            <a href="/demo/dashboard" class="glass tab" data-page="dashboard">Dashboard</a>
            <a href="/demo/cuentas" class="glass tab" data-page="cuentas">Cuentas</a>
            <a href="/demo/movimientos" class="glass tab" data-page="movimientos">Movimientos</a>
            <a href="/demo/inversiones" class="glass tab" data-page="inversiones">Inversiones</a>
            <a href="/demo/trading" class="glass tab" data-page="trading">Trading</a>
        </div>
        <div class="user-container glass tab">
            <a href="/demo/configuracion" data-abrir-configuracion aria-label="Configuración" title="Configuración">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="conf-icon">
                    <path d="M11 10.27 7 3.34"/>
                    <path d="m11 13.73-4 6.93"/>
                    <path d="M12 22v-2"/>
                    <path d="M12 2v2"/>
                    <path d="M14 12h8"/>
                    <path d="m17 20.66-1-1.73"/>
                    <path d="m17 3.34-1 1.73"/>
                    <path d="M2 12h2"/>
                    <path d="m20.66 17-1.73-1"/>
                    <path d="m20.66 7-1.73 1"/>
                    <path d="m3.34 17 1.73-1"/>
                    <path d="m3.34 7 1.73 1"/>
                    <circle cx="12" cy="12" r="2"/>
                    <circle cx="12" cy="12" r="8"/>
                </svg>
            </a>
        </div>
    </header>

    <!-- CONTENIDO DINÁMICO -->
    <main id="app-content"></main>

    <!-- LASTRAR -->
    <footer id="app-footer"></footer>

    <!-- PLANTILLAS DE MODAL · INICIO
         Cuerpos de modal declarados en HTML. Se clonan con
         contenidoDesdeTemplate() (js/ui/modal.js), que rellena los huecos
         [data-tpl] con textContent: sin XSS y sin peticiones extra.
         El service worker ya precachea este archivo. El bloque entero se
         replica en tester.html (la demo carga las mismas páginas);
         tests/plantillas.test.mjs verifica que no se desincronicen. -->

    <template id="tpl-confirmar-eliminar">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Eliminar este movimiento?</p>
            <p class="modal-message-desc">
                <strong data-tpl="concepto"></strong> ·
                <span data-tpl="fecha"></span>
            </p>
        </div>
    </template>

    <!-- Genéricos reutilizables por varios modales -->

    <template id="tpl-mensaje">
        <div class="modal-message">
            <p class="modal-message-desc" data-tpl="mensaje"></p>
        </div>
    </template>

    <template id="tpl-error">
        <div class="modal-message">
            <p class="modal-message-error" data-tpl="error"></p>
        </div>
    </template>

    <template id="tpl-cargando">
        <div class="modal-loading">
            <span data-tpl="logo"></span>
            <p class="modal-loading-text" data-tpl="texto"></p>
        </div>
    </template>

    <template id="tpl-resultado-simple">
        <div class="modal-message">
            <p class="modal-message-desc" data-tpl="descripcion"></p>
            <div class="modal-resultado">
                <div class="preview-item">
                    <span data-tpl="etiqueta-total"></span>
                    <span class="preview-number" data-tpl="total"></span>
                </div>
            </div>
        </div>
    </template>

    <!-- Configuración: cuenta, datos y reautenticación -->

    <template id="tpl-form-password">
        <form class="form-movimiento" data-tpl="form" data-tpl-attr="id">
            <div class="form-group">
                <label for="nueva-password">Nueva contraseña</label>
                <input type="password" id="nueva-password" class="form-input" autocomplete="new-password" required>
                <span class="form-hint">Mínimo 6 caracteres</span>
            </div>
            <div class="form-group">
                <label for="confirmar-password" data-tpl="etiqueta-confirmar">Confirmar contraseña</label>
                <input type="password" id="confirmar-password" class="form-input" autocomplete="new-password" required>
            </div>
            <div id="password-error" class="modal-message-error" hidden></div>
        </form>
    </template>

    <template id="tpl-confirmar-logout">
        <div class="modal-message">
            <p class="modal-message-desc">
                ¿Estás seguro de que quieres cerrar sesión?
            </p>
        </div>
    </template>

    <template id="tpl-restaurar-cuentas">
        <div class="modal-message">
            <p class="modal-message-desc">
                Elige las cuentas archivadas que quieres volver a activas.
            </p>
            <p class="modal-message-hint">
                Recuperan su sitio en el sidebar y vuelven a sumar en el patrimonio
                y el dashboard. Sus movimientos no se han tocado.
            </p>
        </div>
        <div class="dashboard-editor-grid" data-tpl="opciones"></div>
    </template>

    <template id="tpl-cuenta-archivable">
        <label class="dashboard-card-opcion">
            <input type="checkbox" data-tpl="id" data-tpl-attr="value" checked>
            <span>
                <span data-tpl="nombre">Cuenta</span>
                <small data-tpl="saldo"></small>
            </span>
        </label>
    </template>

    <template id="tpl-archivo-invalido">
        <div class="modal-message">
            <p class="modal-message-error" data-tpl="error"></p>
            <p class="modal-message-desc">
                Asegúrate de que sea un archivo .dvid generado por escinco.
            </p>
        </div>
    </template>

    <template id="tpl-preview-importacion">
        <div class="modal-preview">
            <div class="preview-row">
                <span class="preview-label">Formato</span>
                <span class="preview-value" data-tpl="formato"></span>
            </div>
            <div class="preview-row">
                <span class="preview-label">Versión mínima</span>
                <span class="preview-value" data-tpl="version-minima"></span>
            </div>
            <div class="preview-row">
                <span class="preview-label">Exportado</span>
                <span class="preview-value" data-tpl="exportado"></span>
            </div>

            <div class="preview-content">
                <div class="preview-content-title">CONTENIDO</div>
                <div class="preview-item">
                    <span>Cuentas</span>
                    <span class="preview-number" data-tpl="cuentas"></span>
                </div>
                <div class="preview-item">
                    <span>Movimientos</span>
                    <span class="preview-number" data-tpl="movimientos"></span>
                </div>
                <div class="preview-item">
                    <span>Activos</span>
                    <span class="preview-number" data-tpl="activos"></span>
                </div>
                <div class="preview-item">
                    <span>Pendientes</span>
                    <span class="preview-number" data-tpl="pendientes"></span>
                </div>
                <div class="preview-item">
                    <span>Inversiones</span>
                    <span class="preview-number" data-tpl="posiciones"></span>
                </div>
                <div class="preview-item">
                    <span>Historial precios</span>
                    <span class="preview-number" data-tpl="historial"></span>
                </div>
                <div class="preview-item">
                    <span>Snapshots</span>
                    <span class="preview-number" data-tpl="snapshots"></span>
                </div>
            </div>

            <div class="modal-warning">
                Los datos se <strong>agregarán</strong> a los existentes. No se eliminará nada.
            </div>
        </div>
    </template>

    <template id="tpl-resultado-importacion">
        <div class="modal-message">
            <div class="modal-resultado">
                <div class="preview-item">
                    <span>Cuentas</span>
                    <span class="preview-number" data-tpl="cuentas"></span>
                </div>
                <div class="preview-item">
                    <span>Movimientos</span>
                    <span class="preview-number" data-tpl="movimientos"></span>
                </div>
                <div class="preview-item">
                    <span>Activos</span>
                    <span class="preview-number" data-tpl="activos"></span>
                </div>
                <div class="preview-item">
                    <span>Pendientes</span>
                    <span class="preview-number" data-tpl="pendientes"></span>
                </div>
                <div class="preview-item">
                    <span>Inversiones</span>
                    <span class="preview-number" data-tpl="posiciones"></span>
                </div>
                <div class="preview-item">
                    <span>Historial precios</span>
                    <span class="preview-number" data-tpl="historial"></span>
                </div>
                <div class="preview-item">
                    <span>Snapshots</span>
                    <span class="preview-number" data-tpl="snapshots"></span>
                </div>
            </div>
            <p class="modal-message-warning" data-tpl="errores" data-tpl-oculto hidden></p>
        </div>
    </template>

    <template id="tpl-eliminar-todos">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Estás seguro?</p>
            <p class="modal-message-desc">Se eliminarán <strong>todos</strong> tus datos de escinco:</p>
            <div class="modal-list">
                • Cuentas<br>
                • Movimientos<br>
                • Inversiones<br>
                • Pendientes<br>
                • Snapshots<br>
                • Trades
            </div>
        </div>
    </template>

    <template id="tpl-eliminar-cuenta">
        <div class="modal-message">
            <p class="modal-message-title-danger">¿Estás seguro?</p>
            <p class="modal-message-desc">
                Se eliminará tu <strong>cuenta</strong> y <strong>todos tus datos</strong> de escinco permanentemente:
            </p>
            <div class="modal-list">
                • Cuentas<br>
                • Movimientos<br>
                • Inversiones<br>
                • Pendientes<br>
                • Snapshots<br>
                • Trades
            </div>
            <p class="modal-message-desc">
                Antes de borrar se descargará automáticamente un respaldo <strong>.dvid</strong>.
            </p>
            <p class="modal-message-error">Esta acción no se puede deshacer.</p>
        </div>
    </template>

    <template id="tpl-confirmar-escritura">
        <div class="modal-message">
            <p class="modal-message-title-danger">Última oportunidad</p>
            <p class="modal-message-desc">
                Para confirmar, escribe <strong class="text-danger">ELIMINAR</strong> a continuación:
            </p>
            <input type="text" data-tpl="campo" data-tpl-attr="id"
                   class="form-input modal-input-confirm"
                   placeholder="Escribe ELIMINAR"
                   autocomplete="off">
        </div>
    </template>

    <template id="tpl-reauth-password">
        <div class="modal-message">
            <p class="modal-message-desc">
                Por seguridad, confirma tu contraseña antes de continuar:
            </p>
            <input type="password" id="reauth-password"
                   class="form-input modal-input-confirm"
                   placeholder="Tu contraseña"
                   autocomplete="current-password">
            <p class="modal-message-error" id="reauth-error" hidden></p>
        </div>
    </template>

    <template id="tpl-reauth-google">
        <div class="modal-message">
            <p class="modal-message-desc">
                Por seguridad, vuelve a iniciar sesión con Google para continuar.
            </p>
        </div>
    </template>

    <!-- PLANTILLAS DE MODAL · FIN -->

    <script type="module" src="js/demo/demo.js"></script>
</body>

</html>
