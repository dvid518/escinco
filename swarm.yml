project: escinco

# Usamos OpenCode para dividir la tarea (ahorra depender de Anthropic).
splitter:
  provider: openai 
  model: nvidia/nemotron-3.5-super-vl-120b-a12b  # O el modelo local de Ollama
  api_key_env: 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 

max_agents: 2 
worktree_dir: .swarm
branch_prefix: swarm/

auto_merge: false
merge_strategy: sequential
on_conflict: ask
on_done: notify

# El agente por defecto será OpenCode
default_agent: opencode

# Asignamos OpenCode a todos los roles
agents:
  architect: opencode
  coder: opencode
  tester: opencode
  reviewer: opencode

agent_config:
  opencode:
    # Al poner "opencode" a secas, le decimos que use el que está en tu terminal
    command: "opencode"  
    model: "" 
    extra_flags: []