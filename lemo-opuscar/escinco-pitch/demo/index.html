<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>escinco Pitch — Dark Tech Keynote</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0A0B0F; overflow: hidden; font-family: Inter, Arial, sans-serif; }
        canvas { display: block; }
        #ui {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 100;
            color: #E8EAF0;
            font: 14px Inter, monospace;
            pointer-events: none;
        }
        #ui select, #ui input { pointer-events: auto; background: #12151C; border: 1px solid rgba(255,255,255,0.08); color: #E8EAF0; padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="ui">
        <label>Scene: <select id="scene">
            <option value="film">Full Film</option>
            <option value="engineDemo">Engine Demo</option>
        </select></label>
        <label> Time: <input type="range" id="time" min="0" max="36" step="0.04167" value="0"> <span id="timeVal">0.00s</span></label>
        <label> <input type="checkbox" id="pause"> Pause</label>
    </div>
    <script type="module">
        import { init, renderFrame } from '/@film/main.js';
        import { engineDemo } from '/@film/frames.js';

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const timeInput = document.getElementById('time');
        const timeVal = document.getElementById('timeVal');
        const sceneSelect = document.getElementById('scene');
        const pauseCheckbox = document.getElementById('pause');

        let currentTime = 0;
        let rafId = null;
        let lastTime = 0;
        let paused = false;

        await init({ width: 1920, height: 1080 });

        function animate(timestamp) {
            if (!paused) {
                const dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;
                currentTime += dt;
                if (currentTime > 36) currentTime = 0;
                timeInput.value = currentTime;
                timeVal.textContent = currentTime.toFixed(2) + 's';
            }
            if (sceneSelect.value === 'engineDemo') {
                engineDemo(ctx, currentTime);
            } else {
                renderFrame(currentTime);
            }
            rafId = requestAnimationFrame(animate);
        }

        timeInput.addEventListener('input', () => {
            currentTime = parseFloat(timeInput.value);
            timeVal.textContent = currentTime.toFixed(2) + 's';
            paused = true;
            pauseCheckbox.checked = true;
            if (sceneSelect.value === 'engineDemo') engineDemo(ctx, currentTime);
            else renderFrame(currentTime);
        });

        pauseCheckbox.addEventListener('change', () => {
            paused = pauseCheckbox.checked;
            if (!paused) lastTime = performance.now();
        });

        sceneSelect.addEventListener('change', () => {
            paused = true;
            pauseCheckbox.checked = true;
        });

        rafId = requestAnimationFrame(animate);
    </script>
</body>
</html>
