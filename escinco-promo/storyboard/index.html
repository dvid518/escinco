<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>escinco · Todo cuadra — storyboard</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter_18pt-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter_18pt-Medium.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter_18pt-SemiBold.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("fonts/Inter_18pt-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "Roboto Mono"; src: url("fonts/RobotoMono-Regular.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: "Roboto Mono"; src: url("fonts/RobotoMono-Medium.ttf") format("truetype"); font-weight: 500; }
  @font-face { font-family: "Roboto Mono"; src: url("fonts/RobotoMono-SemiBold.ttf") format("truetype"); font-weight: 600; }
  html, body { margin: 0; padding: 0; background: #08090b; }
  canvas { display: block; width: 1920px; height: 2600px; }
</style>
</head>
<body>
<canvas id="hoja" width="1920" height="2600"></canvas>
<script>
const cv = document.getElementById('hoja');
const ctx = cv.getContext('2d');

const C = {
  bg: '#08090b', stage: '#0b0c0f', stage2: '#141414',
  surface: '#1a1b1f', surface2: '#22242a', surface3: '#2b2e35',
  text: '#f1f1f1', secondary: '#d4e1ed', muted: '#8fa3b5', faint: '#465b6d',
  green: '#96ffa1', greenDeep: '#00a269', red: '#fe8f8f', redDeep: '#dc0051',
  mustard: '#feca6f', orange: '#ff7817', violet: '#741fa2', piggie: '#ff5a91', aqua: '#1eaa9c',
  border: 'rgba(212,225,237,0.18)', borderStrong: 'rgba(212,225,237,0.38)',
  glass: 'rgba(20,22,27,0.72)', glass2: 'rgba(30,33,40,0.82)'
};

const LOGO_PATH = "M 0,14.355469 2.2460938,7.421875 C 7.4218645,9.2448552 11.181626,10.82363 13.525391,12.158203 12.906885,6.2663426 12.581365,2.2136123 12.548828,0 l 7.080078,0 c -0.09768,3.2227258 -0.472027,7.2591801 -1.123047,12.109375 3.35284,-1.692646 7.193982,-3.2551444 11.523438,-4.6875 l 2.246094,6.933594 c -4.134146,1.367244 -8.186877,2.278702 -12.158204,2.734375 1.985652,1.725314 4.785129,4.801483 8.398438,9.228515 L 22.65625,30.46875 C 20.768205,27.89718 18.53839,24.397835 15.966797,19.970703 13.557926,24.560595 11.442043,28.059941 9.6191406,30.46875 L 3.8574219,26.318359 C 7.6334528,21.663463 10.335273,18.587294 11.962891,17.089844 7.763661,16.276098 3.7760348,15.364641 0,14.355469";
const logoPath = new Path2D(LOGO_PATH);

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rr(x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}

function font(weight, size, mono) {
  return `${weight} ${size}px "${mono ? 'Roboto Mono' : 'Inter'}", ${mono ? 'monospace' : 'sans-serif'}`;
}

function text(str, x, y, opt = {}) {
  const { size = 14, weight = 500, mono = false, color = C.text, align = 'left', baseline = 'middle', spacing = 0, alpha = 1 } = opt;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = font(weight, size, mono);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.restore();
}

function stage(opt = {}) {
  const { grid = true, gridAlpha = 1, glow = true, vignette = true, w = 1600, h = 900 } = opt;
  ctx.fillStyle = C.stage;
  ctx.fillRect(0, 0, w, h);

  let g = ctx.createRadialGradient(w * 0.5, h * 0.04, 0, w * 0.5, h * 0.45, w * 0.78);
  g.addColorStop(0, 'rgba(38,44,56,0.50)');
  g.addColorStop(0.5, 'rgba(18,20,26,0.30)');
  g.addColorStop(1, 'rgba(6,7,9,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  if (glow) {
    g = ctx.createRadialGradient(w * 0.82, h * 0.18, 0, w * 0.82, h * 0.18, w * 0.55);
    g.addColorStop(0, 'rgba(30,42,60,0.24)');
    g.addColorStop(1, 'rgba(30,42,60,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  if (grid) {
    ctx.save();
    ctx.globalAlpha = gridAlpha;
    const step = 48;
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x += step) {
      const strong = (x / step) % 4 === 0;
      ctx.strokeStyle = strong ? 'rgba(212,225,237,0.060)' : 'rgba(212,225,237,0.032)';
      ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); ctx.stroke();
    }
    for (let y = 0; y <= h; y += step) {
      const strong = (y / step) % 4 === 0;
      ctx.strokeStyle = strong ? 'rgba(212,225,237,0.060)' : 'rgba(212,225,237,0.032)';
      ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); ctx.stroke();
    }
    ctx.restore();
  }

  if (vignette) {
    g = ctx.createRadialGradient(w * 0.5, h * 0.45, h * 0.20, w * 0.5, h * 0.5, w * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.72, 'rgba(0,0,0,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
}

function card(x, y, w, h, opt = {}) {
  const { fill = C.surface, border = C.border, r = 20, shadow = true, glow = 0, alpha = 1, accent = null } = opt;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (shadow) {
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 26;
    ctx.shadowOffsetY = 10;
  }
  rr(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  if (glow) {
    ctx.shadowColor = `rgba(150,255,161,${glow})`;
    ctx.shadowBlur = 34;
    ctx.strokeStyle = `rgba(150,255,161,${Math.min(0.55, glow + 0.18)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.shadowColor = 'transparent';
  }
  ctx.strokeStyle = accent || border;
  ctx.lineWidth = 1;
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r);
  ctx.stroke();
  // inner top highlight
  ctx.strokeStyle = 'rgba(255,255,255,0.055)';
  ctx.beginPath();
  ctx.moveTo(x + r, y + 1.5);
  ctx.lineTo(x + w - r, y + 1.5);
  ctx.stroke();
  ctx.restore();
}

function pill(x, y, w, h, label, opt = {}) {
  const { fill = 'rgba(212,225,237,0.08)', border = C.border, color = C.secondary, size = 12, mono = true, weight = 500, align = 'center' } = opt;
  ctx.save();
  rr(x, y, w, h, h / 2);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  text(label, align === 'center' ? x + w / 2 : x + 14, y + h / 2 + 0.5, { size, mono, weight, color, align });
}

function logo(x, y, size, color = C.green, glow = 0) {
  ctx.save();
  if (glow) {
    ctx.shadowColor = `rgba(150,255,161,${glow})`;
    ctx.shadowBlur = size * 0.75;
  }
  ctx.translate(x, y);
  ctx.scale(size / 32, size / 32);
  ctx.fillStyle = color;
  ctx.fill(logoPath);
  ctx.restore();
}

function cursor(x, y, h, color = C.green, glow = 0.55) {
  ctx.save();
  ctx.shadowColor = `rgba(150,255,161,${glow})`;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.fillRect(x, y - h / 2, 4, h);
  ctx.restore();
}

function chart(x, y, w, h, pts, color = C.green, opt = {}) {
  const { fill = true, dots = true, grid = true, lineWidth = 2.5, alpha = 1 } = opt;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (grid) {
    ctx.strokeStyle = 'rgba(212,225,237,0.09)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const yy = y + (h * i) / 4;
      ctx.beginPath(); ctx.moveTo(x, yy + 0.5); ctx.lineTo(x + w, yy + 0.5); ctx.stroke();
    }
  }
  const min = Math.min(...pts), max = Math.max(...pts);
  const px = (i) => x + (w * i) / (pts.length - 1);
  const py = (v) => y + h - ((v - min) / (max - min || 1)) * h * 0.86 - h * 0.06;
  if (fill) {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, 'rgba(150,255,161,0.22)');
    g.addColorStop(1, 'rgba(150,255,161,0.01)');
    ctx.beginPath();
    ctx.moveTo(px(0), py(pts[0]));
    for (let i = 1; i < pts.length; i++) ctx.lineTo(px(i), py(pts[i]));
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = lineWidth;
  ctx.shadowColor = 'rgba(150,255,161,0.55)';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(px(0), py(pts[0]));
  for (let i = 1; i < pts.length; i++) ctx.lineTo(px(i), py(pts[i]));
  ctx.stroke();
  ctx.shadowColor = 'transparent';
  if (dots) {
    for (let i = 0; i < pts.length; i++) {
      ctx.beginPath();
      ctx.arc(px(i), py(pts[i]), 3.2, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = 'rgba(11,12,15,0.9)'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  ctx.restore();
}

function gridCells(x, y, cols, rows, cw, ch, opt = {}) {
  const { alpha = 1, numbers = true } = opt;
  const rnd = mulberry(41);
  ctx.save();
  ctx.globalAlpha = alpha;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const xx = x + i * cw, yy = y + j * ch;
      ctx.fillStyle = (i + j) % 2 ? 'rgba(31,31,31,0.55)' : 'rgba(20,20,20,0.75)';
      ctx.fillRect(xx, yy, cw - 1, ch - 1);
      ctx.strokeStyle = 'rgba(212,225,237,0.10)';
      ctx.lineWidth = 1;
      ctx.strokeRect(xx + 0.5, yy + 0.5, cw - 1, ch - 1);
      if (numbers && rnd() > 0.35) {
        const val = rnd() > 0.5 ? (rnd() * 9000 + 100).toFixed(2) : '-' + (rnd() * 900 + 40).toFixed(2);
        text(val, xx + 8, yy + ch / 2, { size: 10, mono: true, color: val.startsWith('-') ? C.red : C.secondary, alpha: 0.55 });
      }
    }
  }
  ctx.restore();
}

// ------------------------------------------------------------
// 01 · LA CÉLULA VACÍA
// ------------------------------------------------------------
function shot1() {
  stage();
  text('HOJA DE CÁLCULO · 2026', 80, 78, { size: 12, mono: true, color: C.faint, spacing: 2 });
  text('PATRIMONIO', 80, 104, { size: 11, mono: true, color: C.muted, spacing: 3 });

  // faint neighbouring cells
  ctx.save();
  ctx.globalAlpha = 0.35;
  for (let i = 0; i < 5; i++) {
    const xx = 150 + i * 260, yy = 150 + (i % 2) * 30;
    ctx.strokeStyle = 'rgba(212,225,237,0.10)';
    ctx.strokeRect(xx, yy, 220, 70);
    text((1200 + i * 431).toFixed(2), xx + 12, yy + 35, { size: 11, mono: true, color: C.faint });
  }
  ctx.restore();

  const x = 300, y = 300, w = 1000, h = 300;
  card(x, y, w, h, { fill: 'rgba(16,17,21,0.94)', border: 'rgba(212,225,237,0.30)', r: 24, glow: 0.05 });
  text('B7', x + 26, y + 28, { size: 12, mono: true, color: C.faint, spacing: 1 });
  text('= SUMA DE 5 APP', x + 26, y + 52, { size: 11, mono: true, color: 'rgba(143,163,181,0.55)', spacing: 1 });

  const num = 'S/ 11,368.60';
  const size = 104;
  ctx.save();
  ctx.font = font(600, size, true);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const glitch = new Set([4, 6, 9]);
  let xx = x + 58;
  const yy = y + 178;
  for (let i = 0; i < num.length; i++) {
    const ch = num[i];
    const cw = ctx.measureText(ch).width;
    const bad = glitch.has(i);
    ctx.save();
    if (bad) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = i === 9 ? C.red : C.secondary;
      ctx.fillText(i === 4 ? '#' : i === 6 ? '8' : '0', xx + (i % 2 ? 4 : -5), yy + (i % 2 ? -6 : 5));
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = C.red;
      ctx.fillText(ch, xx + 8, yy + 3);
    } else {
      ctx.fillStyle = C.text;
      ctx.fillText(ch, xx, yy);
    }
    ctx.restore();
    xx += cw;
  }
  // green cursor
  cursor(xx + 16, yy, 118, C.green, 0.7);
  ctx.restore();

  text('S/ 3,200.00  +  $ 4,573.50  +  ₮ 120.00  −  S/ 1,250.00', x + 58, y + 252, { size: 13, mono: true, color: 'rgba(143,163,181,0.62)', spacing: 1 });
  text('NO CUADRA', x + w - 140, y + 36, { size: 11, mono: true, color: C.red, spacing: 2, align: 'right' });

  // floating digits
  const rnd = mulberry(7);
  for (let i = 0; i < 14; i++) {
    text(String(Math.floor(rnd() * 9)), 120 + rnd() * 1360, 120 + rnd() * 660, {
      size: 12 + rnd() * 22, mono: true, color: rnd() > 0.7 ? C.red : C.faint, alpha: 0.18 + rnd() * 0.18
    });
  }
}

// ------------------------------------------------------------
// 02 · LA DISPERSIÓN
// ------------------------------------------------------------
function shot2() {
  stage();
  // central void
  const g = ctx.createRadialGradient(800, 450, 40, 800, 450, 430);
  g.addColorStop(0, 'rgba(8,9,11,0.85)');
  g.addColorStop(1, 'rgba(8,9,11,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1600, 900);

  text('?', 800, 470, { size: 300, weight: 700, color: 'rgba(212,225,237,0.09)', align: 'center' });

  const rnd = mulberry(22);
  const items = [
    { x: 100, y: 112, w: 380, h: 138, rot: -0.09, label: 'BANCO', value: 'S/ 3,200.00', color: C.text, blur: 0 },
    { x: 1110, y: 92, w: 390, h: 138, rot: 0.07, label: 'BROKER', value: '$ 4,573.50', color: C.text, blur: 0 },
    { x: 120, y: 640, w: 370, h: 138, rot: 0.06, label: 'TARJETA', value: '−S/ 1,250.00', color: C.red, blur: 1.1 },
    { x: 1100, y: 660, w: 390, h: 138, rot: -0.06, label: 'EXCHANGE', value: '₮ 120.00', color: C.text, blur: 0 },
    { x: 410, y: 84, w: 320, h: 118, rot: 0.04, label: 'EFECTIVO', value: 'S/ 500.00', color: C.text, blur: 1.4 },
    { x: 870, y: 720, w: 330, h: 118, rot: -0.04, label: 'OTRA APP', value: '$ 820.00', color: C.text, blur: 1.4 },
    { x: 1110, y: 380, w: 300, h: 110, rot: 0.10, label: 'OTRA CUENTA', value: '€ 1,200.00', color: C.text, blur: 1.8 },
    { x: 180, y: 380, w: 300, h: 110, rot: -0.11, label: 'OTRO BROKER', value: '$ 2,100.00', color: C.text, blur: 1.8 }
  ];

  // trails
  ctx.save();
  ctx.setLineDash([4, 8]);
  ctx.strokeStyle = 'rgba(150,255,161,0.18)';
  ctx.lineWidth = 1.2;
  for (const it of items) {
    const cx = it.x + it.w / 2, cy = it.y + it.h / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.bezierCurveTo(cx + (800 - cx) * 0.4, cy + (450 - cy) * 0.2, 800 + (cx - 800) * 0.2, 450 + (cy - 450) * 0.4, 800, 450);
    ctx.stroke();
  }
  ctx.restore();

  for (const it of items) {
    ctx.save();
    ctx.translate(it.x + it.w / 2, it.y + it.h / 2);
    ctx.rotate(it.rot);
    ctx.translate(-it.w / 2, -it.h / 2);
    if (it.blur) ctx.filter = `blur(${it.blur}px)`;
    card(0, 0, it.w, it.h, { fill: 'rgba(26,27,31,0.92)', border: 'rgba(212,225,237,0.20)', r: 18 });
    text(it.label, 22, 30, { size: 10, mono: true, color: C.muted, spacing: 2 });
    text(it.value, 22, 82, { size: 30, mono: true, color: it.color, weight: 600 });
    ctx.restore();
  }

  // currency coins
  const coins = [
    { x: 340, y: 300, s: 'S/' }, { x: 1260, y: 300, s: '$' },
    { x: 700, y: 250, s: '€' }, { x: 540, y: 690, s: '₮' }
  ];
  for (const c of coins) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(c.x, c.y, 30, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(20,22,27,0.9)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(212,225,237,0.22)';
    ctx.stroke();
    text(c.s, c.x, c.y + 1, { size: 22, mono: true, color: C.secondary, align: 'center', weight: 600 });
    ctx.restore();
  }

  pill(710, 420, 180, 44, 'NO CUADRA', { fill: 'rgba(254,143,143,0.10)', border: 'rgba(254,143,143,0.45)', color: C.red, size: 11, weight: 600 });

  // cursor at the edge
  cursor(820, 540, 54, C.green, 0.4);
  const rnd2 = mulberry(9);
  for (let i = 0; i < 10; i++) {
    text(String(Math.floor(rnd2() * 9)), 80 + rnd2() * 1440, 80 + rnd2() * 740, {
      size: 10 + rnd2() * 14, mono: true, color: C.faint, alpha: 0.12 + rnd2() * 0.12
    });
  }
}

// ------------------------------------------------------------
// 03 · EL NÚMERO QUE NO CUADRA
// ------------------------------------------------------------
function shot3() {
  stage();
  text('CÁLCULO MANUAL', 80, 78, { size: 12, mono: true, color: C.faint, spacing: 2 });
  pill(1310, 56, 210, 42, 'ERROR DE SUMA', { fill: 'rgba(254,143,143,0.10)', border: 'rgba(254,143,143,0.45)', color: C.red, size: 11, weight: 600 });

  text('?', 800, 400, { size: 420, weight: 700, color: 'rgba(254,143,143,0.055)', align: 'center' });

  const num = 'S/ 11,368.60';
  const size = 154;
  ctx.save();
  ctx.font = font(600, size, true);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const total = ctx.measureText(num).width;
  let xx = 800 - total / 2;
  const yy = 340;
  const rnd = mulberry(31);
  const bad = new Set([4, 5, 7, 9]);
  for (let i = 0; i < num.length; i++) {
    const ch = num[i];
    const cw = ctx.measureText(ch).width;
    if (bad.has(i)) {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = i % 2 ? C.red : C.secondary;
      ctx.fillText(i === 4 ? '#' : i === 5 ? '8' : i === 7 ? '%' : 'Ø', xx + (rnd() * 12 - 6), yy + (rnd() * 12 - 6));
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = C.red;
      ctx.fillText(ch, xx + 14, yy + 4);
      ctx.restore();
    } else {
      ctx.fillStyle = C.text;
      ctx.fillText(ch, xx, yy);
    }
    xx += cw;
  }
  ctx.restore();

  // broken rule
  ctx.save();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 3;
  ctx.setLineDash([26, 14, 8, 18]);
  ctx.beginPath();
  ctx.moveTo(330, 440);
  ctx.lineTo(1270, 440);
  ctx.stroke();
  ctx.restore();

  text('¿CUÁNTO TENGO REALMENTE?', 800, 560, { size: 50, weight: 700, color: C.secondary, align: 'center', spacing: 1 });
  text('S/ 3,200.00  +  $ 4,573.50  +  ₮ 120.00  −  S/ 1,250.00  +  € 1,200.00  …', 800, 625, { size: 14, mono: true, color: 'rgba(143,163,181,0.55)', align: 'center', spacing: 1 });

  // glitch bars
  const rnd2 = mulberry(17);
  for (let i = 0; i < 9; i++) {
    const y = 250 + rnd2() * 230;
    const x = 260 + rnd2() * 900;
    ctx.fillStyle = i % 3 === 0 ? 'rgba(254,143,143,0.20)' : 'rgba(212,225,237,0.10)';
    ctx.fillRect(x, y, 40 + rnd2() * 160, 2 + rnd2() * 3);
  }

  // cursor hesitating
  cursor(1210, 340, 120, C.green, 0.45);
}

// ------------------------------------------------------------
// 04 · EL PUNTO DE CLARIDAD
// ------------------------------------------------------------
function shot4() {
  stage({ gridAlpha: 0.35, glow: false });

function drawSheet() {
  // sheet background
  ctx.fillStyle = '#08090b';
  ctx.fillRect(0, 0, 1920, 2600);

  // header
  text('escinco · TODO CUADRA', 40, 40, { size: 24, weight: 700, color: C.text });
  text('STORYBOARD · 60 s · 1920×1080 · 24 fps · DARK TECH KEYNOTE', 1880, 40, { size: 11, mono: true, color: C.green, align: 'right', spacing: 2 });
  ctx.strokeStyle = 'rgba(212,225,237,0.14)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(40, 68); ctx.lineTo(1880, 68); ctx.stroke();

  const colW = 900, colH = 506, gapX = 40, gapY = 104, top = 100, left = 40;
  for (let i = 0; i < shots.length; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const x = left + col * (colW + gapX);
    const y = top + row * (colH + gapY);
    const s = shots[i];

    // frame
    ctx.save();
    rr(x, y, colW, colH, 18);
    ctx.clip();
    ctx.translate(x, y);
    ctx.scale(colW / 1600, colH / 900);
    s.fn();
    ctx.restore();

    // frame border
    ctx.save();
    rr(x, y, colW, colH, 18);
    ctx.strokeStyle = 'rgba(212,225,237,0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // caption
    const cy = y + colH + 22;
    text(s.n, x + 2, cy + 2, { size: 13, mono: true, color: C.green, weight: 600, spacing: 1 });
    text(s.title, x + 34, cy + 2, { size: 15, weight: 700, color: C.text, spacing: 0.5 });
    text(s.meta, x + 2, cy + 26, { size: 10, mono: true, color: C.muted, spacing: 1 });
    text(s.desc, x + 2, cy + 48, { size: 13, weight: 400, color: C.secondary });
    text(s.vo, x + 2, cy + 68, { size: 12, weight: 400, color: 'rgba(150,255,161,0.78)', spacing: 0.2 });
  }
}

async function init() {
  await document.fonts.load('400 16px Inter');
  await document.fonts.load('500 16px Inter');
  await document.fonts.load('600 16px Inter');
  await document.fonts.load('700 16px Inter');
  await document.fonts.load('400 16px "Roboto Mono"');
  await document.fonts.load('500 16px "Roboto Mono"');
  await document.fonts.load('600 16px "Roboto Mono"');
  await document.fonts.ready;
  drawSheet();
  window.READY = true;
}
init();
</script>
