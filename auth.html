<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>escinco | Acceso</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <meta name="theme-color" content="#141414">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg" media="(prefers-color-scheme: light)">
    <link rel='stylesheet' type='text/css' media='screen' href='css/style.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/index.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/auth.css'>
    <link rel='stylesheet' type='text/css' media='screen' href='css/componentes.css'>
</head>

<body class="loading">
    <main class="login-section">
        <svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="80px" height="80px" id="logo" viewBox="0 0 32 31">
            <g id="text3035" fill="currentColor">
                <path id="path3063" d="M 0,14.355469 2.2460938,7.421875 C 7.4218645,9.2448552 11.181626,10.82363 13.525391,12.158203 12.906885,6.2663426 12.581365,2.2136123 12.548828,0 l 7.080078,0 c -0.09768,3.2227258 -0.472027,7.2591801 -1.123047,12.109375 3.35284,-1.692646 7.193982,-3.2551444 11.523438,-4.6875 l 2.246094,6.933594 c -4.134146,1.367244 -8.186877,2.278702 -12.158204,2.734375 1.985652,1.725314 4.785129,4.801483 8.398438,9.228515 L 22.65625,30.46875 C 20.768205,27.89718 18.53839,24.397835 15.966797,19.970703 13.557926,24.560595 11.442043,28.059941 9.6191406,30.46875 L 3.8574219,26.318359 C 7.6334528,21.663463 10.335273,18.587294 11.962891,17.089844 7.763661,16.276098 3.7760348,15.364641 0,14.355469" />
            </g>
        </svg>

        <!-- ESTADO 1 · INICIAR SESIÓN -->
        <section class="auth-estado" id="estado_login" aria-label="Iniciar sesión">
            <div class="login-form">
                <input type="email" id="login_email" name="email" placeholder="correo electrónico" autocomplete="email"
                    required>
                <div class="pass-block">
                    <div class="pass-field">
                        <input type="password" id="login_clave" name="clave" placeholder="contraseña"
                            autocomplete="current-password" required>
                        <button type="button" class="pass-toggle" data-toggle="login_clave" aria-label="Mostrar contraseña">
                            <svg id="icono-eye" class="lucide lucide-eye" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <button class="submit" id="login_submit" type="button" aria-label="Iniciar sesión">
                        <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="login-divider">
                <span>o</span>
            </div>
            <button class="google-btn" id="login_google" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Continuar con Google</span>
            </button>
            <p class="auth-enlace">
                <a href="/login" data-estado="recuperar">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="auth-enlace">
                ¿No tienes cuenta? <a href="/register" data-estado="registro">Crear cuenta</a>
            </p>
        </section>

        <!-- ESTADO 2 · RECUPERAR CONTRASEÑA -->
        <section class="auth-estado" id="estado_recuperar" aria-label="Recuperar contraseña" hidden>
            <div class="login-form">
                <input type="email" id="recuperar_email" name="email" placeholder="correo electrónico"
                    autocomplete="email" required>
                <div class="pass-block">
                    <div class="pass-field">
                        <button class="auth-texto-btn" id="recuperar_submit" type="button">
                            Enviar enlace de recuperación
                        </button>
                    </div>
                </div>
            </div>
            <p class="auth-aviso" id="recuperar_aviso" role="status"></p>
            <p class="auth-enlace">
                <a href="/login" data-estado="login">Volver al login</a>
            </p>
        </section>

        <!-- ESTADO 3 · CREAR CUENTA -->
        <section class="auth-estado" id="estado_registro" aria-label="Crear cuenta" hidden>
            <div class="login-form">
                <input type="text" id="registro_nombre" name="nombre" placeholder="nombre" autocomplete="name" required>
                <input type="email" id="registro_email" name="email" placeholder="correo electrónico" autocomplete="email"
                    required>
                <div class="pass-block">
                    <div class="pass-field">
                        <input type="password" id="registro_clave" name="clave" placeholder="contraseña"
                            autocomplete="new-password" required>
                        <button type="button" class="pass-toggle" data-toggle="registro_clave"
                            aria-label="Mostrar contraseña">
                            <svg id="icono-eye-registro" class="lucide lucide-eye" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="pass-block">
                    <div class="pass-field">
                        <input type="password" id="registro_confirmar_clave" name="confirmar clave"
                            placeholder="confirmar contraseña" autocomplete="new-password" required>
                        <button type="button" class="pass-toggle" data-toggle="registro_confirmar_clave"
                            aria-label="Mostrar contraseña">
                            <svg id="icono-eye-confirmar" class="lucide lucide-eye" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <button class="submit" id="registro_submit" type="button" aria-label="Crear cuenta">
                        <svg width="20px" height="20px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="login-divider">
                <span>o</span>
            </div>
            <button class="google-btn" id="registro_google" type="button">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                <span>Registrarse con Google</span>
            </button>
            <p class="auth-enlace">
                ¿Ya tienes cuenta? <a href="/login" data-estado="login">Inicia sesión</a>
            </p>
        </section>

        <!-- ESTADO 4 · REVISA TU CORREO -->
        <section class="auth-estado" id="estado_verificacion" aria-label="Revisa tu correo" hidden>
            <p class="auth-mensaje">Te enviamos un enlace de verificación a <span id="verificacion_email"></span>.</p>
            <div class="login-form">
                <button class="auth-texto-btn" id="verificacion_comprobar" type="button">
                    Ya verifiqué mi correo
                </button>
                <button class="auth-enlace-btn" id="verificacion_reenviar" type="button">
                    Reenviar enlace
                </button>
            </div>
            <p class="auth-enlace">
                <a href="/login" data-estado="login">Volver al login</a>
            </p>
        </section>

        <p class="auth-pie">
            <a href="/home">Conoce más sobre escinco</a>
        </p>

        <div data-panel-version></div>
    </main>
</body>
<script type="module" src="js/pages/auth.js"></script>

</html>
